<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="t">workflow-first: start as far left as you can</title>
  <desc id="d">Four steps rise from plain code to workflow to single agent to multi-agent. A checkpoint sits between each step: move right only when the simpler design has been measured to fail. Below, the skill interviews you, writes WORKFLOW.md, runs the checker, and prints OK or FAIL lines.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#D3DAEA"/>
    </pattern>
    <g id="bot" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="-22" x2="0" y2="-31"/>
      <circle cx="0" cy="-35" r="4.5" fill="#FFFFFF"/>
      <rect x="-30" y="-22" width="60" height="44" rx="14" fill="#FFFFFF"/>
      <rect x="-38" y="-8" width="8" height="16" rx="3" fill="#FFFFFF"/>
      <rect x="30" y="-8" width="8" height="16" rx="3" fill="#FFFFFF"/>
      <circle cx="-12" cy="-5" r="4.5" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="-5" r="4.5" fill="currentColor" stroke="none"/>
      <path d="M-9 8 Q0 15 9 8"/>
    </g>
    <g id="gate">
      <path d="M0 -23 L23 0 L0 23 L-23 0 Z" fill="#FFC933" stroke="#0F1B3D" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="-9" y="0" width="5" height="8" fill="#0F1B3D"/>
      <rect x="-2.5" y="-5" width="5" height="13" fill="#0F1B3D"/>
      <rect x="4" y="-10" width="5" height="18" fill="#0F1B3D"/>
    </g>
  </defs>

  <rect width="1200" height="740" fill="#F4F7FC"/>
  <rect width="1200" height="740" fill="url(#dots)"/>

  <!-- Title -->
  <text x="60" y="84" font-size="56" font-weight="800" fill="#0F1B3D">workflow-first</text>
  <text x="60" y="124" font-size="20" fill="#3B4A75">An agent skill that interviews you about an AI project, writes WORKFLOW.md, and checks it.</text>

  <!-- Steps: hard shadow, then card -->
  <g stroke="#0F1B3D" stroke-width="3.5" stroke-linejoin="round">
    <rect x="66" y="306" width="200" height="170" rx="20" fill="#0F1B3D"/>
    <rect x="359" y="266" width="200" height="210" rx="20" fill="#0F1B3D"/>
    <rect x="652" y="226" width="200" height="250" rx="20" fill="#0F1B3D"/>
    <rect x="945" y="186" width="200" height="290" rx="20" fill="#0F1B3D"/>
    <rect x="60" y="300" width="200" height="170" rx="20" fill="#E6EBF7"/>
    <rect x="353" y="260" width="200" height="210" rx="20" fill="#CDE3FF"/>
    <rect x="646" y="220" width="200" height="250" rx="20" fill="#E3DBFF"/>
    <rect x="939" y="180" width="200" height="290" rx="20" fill="#CFF3DD"/>
  </g>

  <!-- Icons -->
  <g fill="none" stroke="#0F1B3D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- plain code -->
    <path d="M138 338 L122 354 L138 370"/>
    <path d="M182 338 L198 354 L182 370"/>
    <path d="M169 332 L151 376"/>
    <!-- workflow -->
    <rect x="444" y="292" width="18" height="16" rx="4"/>
    <path d="M453 308 V318 M423 318 H483 M423 318 V328 M453 318 V328 M483 318 V328"/>
    <rect x="414" y="328" width="18" height="16" rx="4"/>
    <rect x="444" y="328" width="18" height="16" rx="4"/>
    <rect x="474" y="328" width="18" height="16" rx="4"/>
  </g>
  <use xlink:href="#bot" transform="translate(746 280) scale(1.15)" color="#0F1B3D"/>
  <use xlink:href="#bot" transform="translate(1039 224) scale(0.6)" color="#0F1B3D"/>
  <use xlink:href="#bot" transform="translate(1003 252) scale(0.6)" color="#0F1B3D"/>
  <use xlink:href="#bot" transform="translate(1075 252) scale(0.6)" color="#0F1B3D"/>

  <!-- Names and who decides -->
  <g text-anchor="middle" fill="#0F1B3D">
    <text x="160" y="418" font-size="25" font-weight="800">Plain code</text>
    <text x="453" y="378" font-size="25" font-weight="800">Workflow</text>
    <text x="746" y="338" font-size="25" font-weight="800">Single agent</text>
    <text x="1039" y="298" font-size="25" font-weight="800">Multi-agent</text>
  </g>
  <g text-anchor="middle" font-size="15" fill="#3B4A75">
    <text x="160" y="444">Code decides</text>
    <text x="453" y="404">You decide, in code</text>
    <text x="746" y="364">The model picks the path</text>
    <text x="1039" y="324">Models decide at run time</text>
  </g>

  <!-- Start here tag -->
  <path d="M98 283 L110 298 L122 283" fill="#FFC933" stroke="#0F1B3D" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="60" y="248" width="120" height="36" rx="10" fill="#FFC933" stroke="#0F1B3D" stroke-width="3.5"/>
  <text x="120" y="272" font-size="17" font-weight="800" text-anchor="middle" fill="#0F1B3D">Start here</text>

  <!-- Arrows with checkpoints -->
  <g stroke="#0F1B3D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M264 420 H346 M336 410 L347 420 L336 430"/>
    <path d="M557 420 H639 M629 410 L640 420 L629 430"/>
    <path d="M850 420 H932 M922 410 L933 420 L922 430"/>
  </g>
  <use xlink:href="#gate" transform="translate(306.500 420)"/>
  <use xlink:href="#gate" transform="translate(599.500 420)"/>
  <use xlink:href="#gate" transform="translate(892.500 420)"/>

  <!-- Spectrum axis -->
  <g stroke="#0F1B3D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M62 504 H1136 M1124 494 L1137 504 L1124 514"/>
  </g>
  <circle cx="62" cy="504" r="6" fill="#0F1B3D"/>
  <text x="60" y="536" font-size="16" fill="#3B4A75">You hold the control: cheaper, predictable, easy to debug</text>
  <text x="1140" y="536" font-size="16" fill="#3B4A75" text-anchor="end">The model holds the control: flexible, costs more, harder to debug</text>

  <!-- The rule -->
  <rect x="66" y="562" width="1080" height="84" rx="18" fill="#0F1B3D"/>
  <rect x="60" y="556" width="1080" height="84" rx="18" fill="#FFC933" stroke="#0F1B3D" stroke-width="3.5"/>
  <use xlink:href="#gate" transform="translate(112 598)"/>
  <text x="154" y="592" font-size="25" font-weight="800" fill="#0F1B3D">Start as far left as you can.</text>
  <text x="154" y="620" font-size="17" fill="#0F1B3D">Each diamond is a checkpoint: move right only when the simpler design has been measured to fail.</text>

  <!-- Process chevrons -->
  <g stroke="#0F1B3D" stroke-width="3.5" stroke-linejoin="round" fill="#FFFFFF">
    <path d="M60 666 H297 L315 693 L297 720 H60 Z"/>
    <path d="M335 666 H572 L590 693 L572 720 H335 Z"/>
    <path d="M610 666 H847 L865 693 L847 720 H610 Z"/>
    <path d="M885 666 H1122 L1140 693 L1122 720 H885 Z"/>
  </g>
  <g stroke="#0F1B3D" stroke-width="3" fill="none">
    <circle cx="90" cy="693" r="15" fill="#CDE3FF"/>
    <circle cx="365" cy="693" r="15" fill="#E3DBFF"/>
    <circle cx="640" cy="693" r="15" fill="#FFC933"/>
    <circle cx="915" cy="693" r="15" fill="#CFF3DD"/>
  </g>
  <g font-size="17" font-weight="800" text-anchor="middle" fill="#0F1B3D">
    <text x="90" y="699">1</text>
    <text x="365" y="699">2</text>
    <text x="640" y="699">3</text>
    <text x="915" y="699">4</text>
  </g>
  <g font-size="16" font-weight="700" fill="#0F1B3D">
    <text x="116" y="699">Interviews you</text>
    <text x="391" y="699">Writes WORKFLOW.md</text>
    <text x="666" y="699">Runs the checker</text>
    <text x="941" y="699">Prints OK or FAIL:</text>
  </g>
</svg>
